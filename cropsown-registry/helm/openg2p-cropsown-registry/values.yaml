# Crop Sown Registry — values overlay for the openg2p-registry chart.
#
# This chart has no templates; it deploys the openg2p-registry subchart (pinned
# in Chart.yaml, aliased `registry`) with the overrides below. Install:
#
#     helm repo add openg2p https://openg2p.github.io/openg2p-helm
#     helm dependency build ./helm/openg2p-cropsown-registry
#     helm install cropsown-registry ./helm/openg2p-cropsown-registry
#
# Two kinds of override:
#   * global.*    — Helm propagates these to the subchart (and its subcharts).
#   * registry.*  — values for the openg2p-registry subchart itself.
# Everything not listed (keycloak/iam wiring, id-generator, demo users) is
# inherited from the subchart defaults.

# ── Globals (propagate to the openg2p-registry subchart) ──────────────────────
global:
  registryVariant: 'cropsown-registry'
  # Public hosts, on the environment's base domain <namespace>.openg2p.test
  # (crop.openg2p.test). The subchart defaults them all to <namespace>.openg2p.org,
  # a placeholder that resolves nowhere here, which broke Keycloak, MinIO and IAM.
  registryHostname: '{{ .Release.Name }}.{{ .Release.Namespace }}.openg2p.test'
  keycloakBaseUrl: 'https://keycloak.{{ .Release.Namespace }}.openg2p.test'
  minioHost: 'minio-api.{{ .Release.Namespace }}.openg2p.test'
  idGeneratorHostname: 'idgenerator-{{ .Release.Name }}.{{ .Release.Namespace }}.openg2p.test'
  aweHostname: 'awe.{{ .Release.Namespace }}.openg2p.test'

# ── openg2p-registry subchart overrides ───────────────────────────────────────
registry:
  # Crop-sown-built images (each FROM the matching openg2p-registry base image).
  # Only the tag is CI-rewritten in lockstep with the chart version; the base
  # image they extend is pinned by the openg2p-registry dependency version.
  staffApi:
    image:
      repository: openg2p/openg2p-cropsown-registry-staff-api
      tag: 0.0.0-develop
    envVars:
      APPROVER_RESOLVER_SECRET: "cropsown-approver-resolver-secret"
      KEYCLOAK_BASE_URL: '{{ tpl .Values.global.keycloakBaseUrl $ }}'
      KEYCLOAK_REALM: '{{ tpl (default "staff" .Values.global.keycloakRealm) $ }}'
      AUTH_CLIENT_ID: '{{ tpl (default (printf "%s-staff-portal" .Release.Name) .Values.global.authClientId) $ }}'
    envVarsFrom:
      AUTH_CLIENT_SECRET:
        secretKeyRef:
          name: '{{ tpl (default (printf "%s-staff-portal" .Release.Name) .Values.global.authClientSecret) $ }}'
          key: '{{ tpl (default "client_secret" .Values.global.authClientSecretKey) $ }}'
  partnerApi:
    image:
      repository: openg2p/openg2p-cropsown-registry-partner-api
      tag: 0.0.0-develop
  celeryWorker:
    image:
      repository: openg2p/openg2p-cropsown-registry-celery
      tag: 0.0.0-develop
    envVars:
      REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_HOSTNAME: "commons-postgresql"
  celeryBeat:
    image:
      repository: openg2p/openg2p-cropsown-registry-celery
      tag: 0.0.0-develop
  dbSeed:
    image:
      repository: openg2p/openg2p-cropsown-registry-db-seed
      tag: 0.0.0-develop
    envVars:
      APPROVER_RESOLVER_SECRET: "cropsown-approver-resolver-secret"
    # The images/templates loaders are generic and safe to enable. Sample data is
    # NOT: the platform's load_sample_data.py is hardcoded to the reference
    # (farmer) registry's tables, so it cannot load crop sown records. The crop
    # sown sample set ships as SQL at /seed/sample-data in the db-seed image and
    # is applied explicitly (see local/docker-compose.yml), never by this flag.
    #
    # loadGeoData is off because this registry is Ethiopia-only: the db-seed
    # image now applies the real region/zone/woreda/kebele hierarchy itself
    # (docker/db-seed/entrypoint-cropsown.sh). Leaving the platform's generic
    # loader on as well would put a second, unrelated hierarchy in the same
    # master data tables, which the geo dropdowns then mix together.
    loadGeoData: false
    loadSampleData: false
    loadImages: true
    loadTemplates: true

  # Name of this registry's tile in IAM. The roles/permissions catalog itself is
  # registry-agnostic and comes from the subchart.
  iamRegister:
    applicationDescription: "Crop Sown Registry"

  # Functional-ID pools, one per register that generates ids. The subchart
  # defaults to the REFERENCE registry's registers (individual + household), so
  # the crop sown registers must be declared here. NB Helm merges maps, so the
  # defaults are inherited too and unused pools are provisioned — harmless, and a
  # parent `null` cannot remove a subchart default.
  idgenerator:
    idGenerator:
      appConfig:
        # padding 5, matching the ATI ir.sequence definitions
        # (REG/S1/2026/00012 — the S1-S4 segment is the cropping season).
        idTypes:
          cropsown:
            idLength: 5
          production:
            idLength: 5
          cluster:
            idLength: 5
          infestation:
            idLength: 5

  # staffUi's image is set by the pipeline (docker/staff-ui). Its browser-facing
  # IAM URL and cookie domain are on the same .openg2p.test base domain as the
  # globals above. beneApi is consumed as-is from the openg2p-registry base image.
  staffUi:
    iamPublicUrl: 'https://staff-iam.{{ .Release.Namespace }}.openg2p.test'
    envVars:
      COOKIE_DOMAIN: '.{{ .Release.Namespace }}.openg2p.test'

  # ── Crop sown e2e sanity suite (image built here; Set 2 field tests) ────────
  # The subchart ships the reference (Individual) sanity values; override them
  # for the CropSown register. Behaviour toggles (runE2e/failOnError) keep the
  # subchart defaults.
  sanity:
    enabled: true
    image:
      repository: openg2p/openg2p-cropsown-registry-sanity-tests
      tag: 0.0.0-develop
    regType: CropSown
    regRecordType: 'spdci-extensions-dci:CropSown'
    # crop sown functional_record_id of the injected sanity record (see
    # test/sanity/sanity/fixtures.py).
    searchText: SANITY-CROPSOWN-0001
    # Consented scope + scopes asserted absent — top-level keys of the crop sown
    # outgoing DCI template (openg2p_cropsown_to_dci.json.j2).
    dataScopes: "crop_sown_details"
    deniedScopes: "farm_details,crop_production_details,infestation_details,cluster_details"
    # The CropSown register + the UI coordinates the change-request test edits
    # (must match the cropsown-extension seed metadata).
    farmerRegisterId: 6b06a95a-9a6c-5a33-a33d-c1625716c59c
    crTabId: "cropsown_cropsown_tab"
    crSectionId: "cropsown_survey_personnel_section_02"

# ── Reporting layer and dashboard service (this chart's own templates) ────────
# The cs_rpt_* views the dashboard service reads (templates/reporting-views.yaml,
# templates/reporting-views-refresh.yaml) and the service itself
# (templates/dashboard-api.yaml). Both are off by default.
reporting:
  # Registry database. The subchart's globals are not visible to this chart's
  # templates, so the coordinates are repeated here, following the subchart's
  # convention (database and user from the release name, password in the
  # Secret named after the release). host empty = global.postgresqlHost,
  # else commons-postgresql.
  db:
    host: ""
    port: 5432
    name: '{{ .Release.Name | replace "-" "_" }}'
    user: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
    secret: '{{ .Release.Name }}'
    passwordKey: '{{ .Release.Name }}-db-user'
  # Empty: the jobs run in the registry's db-seed image (registry.dbSeed.image),
  # which ships reporting_views.sql and whose tag CI rewrites.
  image:
    repository: ""
    tag: ""
  views:
    enabled: false
    # How long the create job waits for staff-api's migrations on a fresh install.
    waitForSchemaSeconds: 600
    # How often the materialized views are rebuilt. Empty disables the CronJob.
    refreshSchedule: "*/30 * * * *"
    refreshLog:
      enabled: true
      retentionDays: 90
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

dashboardApi:
  enabled: false
  image:
    repository: ""
    tag: ""
  replicas: 1
  # gunicorn workers. Each holds its own database pool (below), so a replica
  # uses up to workers x dbPool.maxSize connections.
  workers: 2
  # Connections per worker: minSize kept open, maxSize under load. The
  # dashboards cache responses, so a few are plenty.
  dbPool:
    minSize: 1
    maxSize: 5
  # CORS origins. Browsers are not expected to call the service directly.
  allowedOrigins: []
  # Extra environment variables, as NAME: value. Values may use templates.
  env: {}
  # Optional hostname route for developers and tools, on a PRIVATE Istio
  # gateway only (the service has no authentication), e.g.
  #   host: dashboard-api.crop.openg2p.test
  #   gateway: internal
  virtualService:
    enabled: false
    host: ""
    gateway: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
