# Let the farmer-ci service account deploy the crop namespace.
#
# Deploy to Dev runs on the vpn-agent2 node with the staging-farmer-kubeconfig
# credential, the one farmer-registry's pipeline deploys its far namespace with.
# That kubeconfig authenticates as system:serviceaccount:far:farmer-ci, which is
# only allowed into far, so the first deploy into crop failed at helm's release
# lookup:
#
#   Error: query: failed to query with labels: secrets is forbidden: User
#   "system:serviceaccount:far:farmer-ci" cannot list resource "secrets" in API
#   group "" in the namespace "crop"
#
# This grants that account the same kind of access in crop and nothing wider:
# the built-in `admin` role in the crop namespace, plus the Istio routing the
# chart creates, which `admin` does not cover. It cannot create namespaces, so
# crop is declared here, and the pipeline runs ci/deploy-dev.sh with
# CREATE_NAMESPACE=false.
#
# Apply ONCE, as a cluster admin (farmer-ci cannot grant itself this), from a
# machine that reaches the cluster — e.g. the kubectl shell in Rancher:
#
#   kubectl apply -f ci/k8s/crop-deploy-rbac.yaml
#
# Check it took:
#
#   kubectl auth can-i list secrets -n crop \
#     --as system:serviceaccount:far:farmer-ci          # yes
---
apiVersion: v1
kind: Namespace
metadata:
  name: crop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: farmer-ci-admin
  namespace: crop
subjects:
  - kind: ServiceAccount
    name: farmer-ci
    namespace: far
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deploy-istio
  namespace: crop
rules:
  - apiGroups: ["networking.istio.io", "security.istio.io"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: farmer-ci-istio
  namespace: crop
subjects:
  - kind: ServiceAccount
    name: farmer-ci
    namespace: far
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deploy-istio
